name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        window: [sdl, glfw]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libfreetype6-dev libpng-dev libglfw3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libgl1-mesa-dev
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git /tmp/sdl
          cmake -S /tmp/sdl -B /tmp/sdl/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/sdl/build --parallel 2
          sudo cmake --install /tmp/sdl/build
      - if: runner.os == 'macOS'
        run: brew install sdl3 glfw freetype libpng
      - run: ./vendor/sengine/tools/fetch_filament.sh
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=vendor/sengine/cmake/clang_libcxx.cmake -Dsengine_window_backend=${{ matrix.window }}
      - run: cmake --build build --parallel 2
